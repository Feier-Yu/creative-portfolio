<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feier Yu — Reimagining Asia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #1a2a3a;
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
}  
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 130% 60% at 50% 0%, #2a3e52 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 0% 70%, #1e3248 0%, transparent 55%),
    radial-gradient(ellipse 70% 45% at 100% 60%, #223a50 0%, transparent 52%);
  pointer-events: none;
  z-index: 0;
}

/* Fixed canvases */
#stars, #grain, #snow {
  position: fixed; inset: 0; pointer-events: none;
}
#stars { z-index: 1; }
#grain { z-index: 1; opacity: 0.036; mix-blend-mode: multiply; }
#snow { z-index: 20; }

/* ═══ TITLE SECTION ═══ */
.title-section {
  position: relative; z-index: 2;
  height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  will-change: transform, opacity;
}
.title-name {
  font-size: clamp(2.2rem, 5.5vw, 4.5rem);
  font-weight: 300;
  color: #d0dfe8;
  letter-spacing: 0.15em;
  line-height: 1.1;
  margin-bottom: 1.5rem;
  text-shadow: 0 2px 20px rgba(0,0,0,0.4);
}
.title-sub {
  font-size: clamp(0.8rem, 1.6vw, 1.2rem);
  font-weight: 300;
  font-style: italic;
  color: #7a9ab0;
  letter-spacing: 0.3em;
  text-shadow: 0 1px 12px rgba(0,0,0,0.3);
}

/* Ink drip title animation */


@keyframes inkReveal {
  0% {
    opacity: 0;
    filter: blur(8px);
    transform: scaleY(0.7) translateY(-10px);
    letter-spacing: 0.4em;
  }
  30% {
    opacity: 0.6;
    filter: blur(3px);
  }
  60% {
    filter: blur(1px);
    transform: scaleY(1.02) translateY(2px);
  }
  100% {
    opacity: 1;
    filter: blur(0);
    transform: scaleY(1) translateY(0);
    letter-spacing: 0.15em;
  }
}
/* Ink drip decorations */
.ink-drip {
  position: absolute;
  width: 2px;
  background: linear-gradient(to bottom, rgba(200,215,230,0.6), transparent);
  border-radius: 0 0 2px 2px;
  opacity: 0;
  animation: drip var(--drip-duration) ease-in var(--drip-delay) forwards;
}
@keyframes drip {
  0% {
    height: 0;
    opacity: 0;
    top: var(--drip-start);
  }
  10% {
    opacity: 0.7;
  }
  70% {
    opacity: 0.4;
  }
  100% {
    height: var(--drip-length);
    opacity: 0;
    top: var(--drip-start);
  }
}

/* Snow accumulation on title */
.snow-shelf {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  opacity: 0;
  animation: snowBuild 4s ease 3s forwards;
}
@keyframes snowBuild {
  0% { opacity: 0; transform: translateY(-3px); }
  100% { opacity: 0.85; transform: translateY(0); }
}

.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  color: #4a6a80;
  text-transform: uppercase;
  animation: bob 2s ease-in-out infinite;
  white-space: nowrap;
}

@keyframes moonPulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
  100% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
}
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

/* ═══ BRANCHES SECTION ═══ */
.branches-section {
  position: relative; z-index: 2;
  height: 1100px;
  overflow: visible;
  margin-top: 5vh;
  
}
.moon-scene {
  position: relative;
  width: 100%; height: 100%;
  overflow: visible;
}
.moon-glow {
  position: absolute;
  width: min(55vw, 550px); height: min(55vw, 550px);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(210,195,160,0.3) 0%, rgba(200,180,130,0.15) 40%, rgba(180,160,110,0.05) 60%, transparent 75%);
  z-index: 1; opacity: 0.9;
}
.moon-wrap {
  position: absolute;
  width: 40vh; height: 40vh;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 8;
  cursor: pointer;
}
.moon-wrap::after {
  content: '';
  position: absolute;
  top: -30%; left: -30%;
  width: 160%; height: 160%;
  border-radius: 50%;
}
.moon-wrap img { width: 100%; height: 100%; object-fit: contain; }

.cloud {
  position: absolute;
  pointer-events: none; user-select: none;
}
.cloud-bg-2 {
  width: 100vw;
  min-width: 100%;
  min-height: 100%;
  bottom: 0; right: 0;
  left: 0;
  object-fit: cover;
  opacity: 0.1;
  z-index: 3;
  filter: brightness(0.5) saturate(0.4) sepia(0.3) hue-rotate(180deg);
  mix-blend-mode: screen;
}
.cloud-left {
  width: max(62vw, 760px);
  top: 36%; left: -6%;
  opacity: 0.94; z-index: 6;

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.15s;
}
.cloud-left.parted {
  transform: translateX(-30vw); opacity: 0.08;
}
.cloud-right {
  width: max(58vw, 720px);
  top: 28%; right: 11%;
  opacity: 0.92; transform: scaleX(-1); z-index: 6;

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.25s;
}
.cloud-right.parted {
  transform: scaleX(-1) translateX(30vw); opacity: 0.08;
}
.cloud-top {
  width: max(70vw, 860px);
  top: 41%; right: -21%;
  opacity: 0.9; z-index: 7;

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.1s;
}
.cloud-top.parted {
  transform: translateY(-18vh); opacity: 0.08;
}
.cloud-bot {
  bottom: 44%; right: -10%;
  opacity: 0.88; z-index: 12;
  transform: translateX(0);
  transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease;
  will-change: transform;

  transition-delay: 0.2s;
}
.cloud-bot.parted {
  transform: translateX(25vw);
  opacity: 0.08;
}

.cloud-tl {
  width: max(42vw, 520px);
  left: -15%;
  opacity: 0.86; z-index: 7;

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.3s;
}
.cloud-tl.parted {
  transform: translate(-22vw, -12vh); opacity: 0.08;
}
.cloud-tr {
  width: max(42vw, 520px);
  top: 0%; right: -5%;
  opacity: 0.84; transform: scaleX(-1); z-index: 7;

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.35s;
}
.cloud-tr.parted {
  transform: scaleX(-1) translate(-22vw, -12vh); opacity: 0.08;
}

/* Fog at bottom */
.fog {
  position: absolute;
  bottom: 0; left: 0; width: 100%; height: 20vh;
  z-index: 15; pointer-events: none;
  background: linear-gradient(to top, rgba(26,42,58,0.7) 0%, rgba(26,42,58,0.3) 40%, transparent 100%);
  animation: fogDrift 12s ease-in-out infinite alternate;
}
@keyframes fogDrift {
  0% { transform: translateX(-2%); opacity: 0.9; }
  100% { transform: translateX(2%); opacity: 1; }
}

/* Project links */

.cloud-extra-1 {
  width: max(50vw, 620px);
  top: 18%;
  left: 8%;
  opacity: 0.82;
  z-index: 5;
  transform: scaleX(-1) scaleY(0.95);

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.18s;
}
.cloud-extra-1.parted {
  transform: scaleX(-1) scaleY(0.95) translateX(28vw); opacity: 0.08;
}
.cloud-extra-2 {
  width: max(55vw, 680px);
  bottom: 18%;
  left: -12%;
  opacity: 0.78;
  z-index: 6;
  transform: rotate(3deg);

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.28s;
}
.cloud-extra-2.parted {
  transform: rotate(3deg) translate(-22vw, 12vh); opacity: 0.08;
}
.cloud-extra-3 {
  width: max(48vw, 580px);
  top: 55%;
  right: -8%;
  opacity: 0.85;
  z-index: 5;
  transform: scaleX(-1) rotate(-2deg);

  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease;
  will-change: transform;

  transition-delay: 0.22s;
}
.cloud-extra-3.parted {
  transform: scaleX(-1) rotate(-2deg) translateX(28vw); opacity: 0.08;
}


/* Center clouds that part on hover */
.cloud-center-left {
  width: max(38vw, 460px);
  top: 38%;
  left: 20%;
  opacity: 0.92;
  z-index: 10;
  transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease;
  will-change: transform;

  transition-delay: 0s;
}
.cloud-center-left.parted {
  transform: translateX(-25vw);
  opacity: 0.08;
}
.cloud-center-right {
  width: max(38vw, 460px);
  top: 35%;
  right: 18%;
  opacity: 0.92;
  z-index: 10;
  transform: scaleX(-1);
  transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease;
  will-change: transform;

  transition-delay: 0.1s;
}
.cloud-center-right.parted {
  transform: scaleX(-1) translateX(-25vw);
  opacity: 0.08;
}
.cloud-center-top {
  width: max(44vw, 540px);
  top: 28%;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0.88;
  z-index: 9;
  transition: transform 2.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s, opacity 2s ease 0.15s;
  will-change: transform;

  transition-delay: 0.2s;
}
.cloud-center-top.parted {
  transform: translateX(-50%) translateY(-18vh);
  opacity: 0.08;
}


.hand-arrow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(18vh, -2vh) rotate(-25deg);
  z-index: 15;
  pointer-events: none;
  opacity: 0.4;
  animation: arrowBob 3s ease-in-out infinite alternate;
}
@keyframes arrowBob {
  0% { transform: translate(18vh, -2vh) rotate(-25deg); opacity: 0.4; }
  100% { transform: translate(17.5vh, -1.5vh) rotate(-23deg); opacity: 0.5; }
}

<script>

// Always scroll to top on load/refresh
window.addEventListener('load', function() {
  if (window.location.hash) {
    var target = document.querySelector(window.location.hash);
    if (target) {
      target.scrollIntoView();
      return;
    }
  }
  window.scrollTo(0, 0);
});
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

// Zoom transition
function zoomTo(e, el) {
  e.preventDefault();
  var overlay = document.getElementById('overlay');
  var rect = el.getBoundingClientRect();
  var ox = ((rect.left + rect.width * 0.5) / window.innerWidth * 100).toFixed(2) + '%';
  var oy = ((rect.top + rect.height * 0.5) / window.innerHeight * 100).toFixed(2) + '%';
  document.body.style.overflow = 'hidden';
  document.body.style.transformOrigin = ox + ' ' + oy;
  document.body.style.transition = 'transform 1.5s cubic-bezier(0.4,0,0.2,1), opacity 1.2s ease';
  document.body.style.transform = 'scale(8)';
  document.body.style.opacity = '0';
  setTimeout(function(){ overlay.classList.add('fade-in'); }, 900);
  setTimeout(function(){ window.location.href = el.getAttribute('href'); }, 1500);
}

// Moon hover — part clouds
(function() {
  var moonWrap = document.querySelector('.moon-wrap');
  var partLeft = document.getElementById('partLeft');
  var partRight = document.getElementById('partRight');
  var partTop = document.getElementById('partTop');
  var cloudBot = document.querySelector('.cloud-bot');
  
  if (moonWrap) {
    var allClouds = document.querySelectorAll('.cloud');
    var autoRevealed = false;
    var parted = false;
    var hoverCount = 0;
    var revealTimer = null;
    var hoverTimer = null;

    function partClouds() {
      parted = true;
      allClouds.forEach(function(c) { c.classList.add('parted'); });
      var mc = document.getElementById('moonCutout');
      if (mc) mc.classList.add('visible');
    }

    function unpartClouds() {
      parted = false;
      allClouds.forEach(function(c) { c.classList.remove('parted'); });
      var mc = document.getElementById('moonCutout');
      if (mc) mc.classList.remove('visible');
    }

    moonWrap.addEventListener('mouseenter', function() {
      partClouds();
      hoverTimer = setTimeout(function() {
        hoverCount++;
        // If clouds have parted before (hoverCount >= 1 after 0.3s), kill auto-part forever
        if (hoverCount >= 1 && revealTimer) {
          clearTimeout(revealTimer);
          revealTimer = null;
        }
      }, 1000);
    });

    moonWrap.addEventListener('mouseleave', function() {
      if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
      if (!autoRevealed) {
        unpartClouds();
      }
    });

    // Auto-reveal after 7.5 seconds — only if user hasn't meaningfully hovered
    var branchObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && hoverCount === 0) {
          revealTimer = setTimeout(function() {
            if (hoverCount === 0) {
              autoRevealed = true;
              partClouds();
            }
          }, 4500);
        } else if (!entry.isIntersecting) {
          if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
          if (autoRevealed) {
            autoRevealed = false;
            unpartClouds();
          }
        }
      });
    }, { threshold: 0.3 });
    branchObserver.observe(document.getElementById('branchesSection'));
  }
})();

// Parallax
window.addEventListener('scroll', function() {
  var scrollY = window.scrollY;
  var vh = window.innerHeight;
  var title = document.getElementById('titleSection');
  var progress = Math.min(scrollY / vh, 1);
  title.style.opacity = 1 - progress * 1.2;
  title.style.transform = 'scale(' + (1 - progress * 0.15) + ') translateY(' + (scrollY * 0.4) + 'px)';
});

// Stars
(function() {
  var c = document.getElementById('stars');
  c.width = window.innerWidth; c.height = window.innerHeight;
  var ctx = c.getContext('2d');
  var stars = [];
  for (var i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.2 + 0.3,
      baseOpacity: Math.random() * 0.5 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2
    });
  }
  var frame = 0;
  function drawStars() {
    ctx.clearRect(0, 0, c.width, c.height);
    frame++;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var twinkle = s.baseOpacity + Math.sin(frame * s.twinkleSpeed + s.phase) * 0.2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(220,235,255,' + Math.max(0, Math.min(1, twinkle)) + ')';
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();
  window.addEventListener('resize', function() { c.width = window.innerWidth; c.height = window.innerHeight; });
})();

// Grain
(function() {
  var c = document.getElementById('grain');
  function render() {
    c.width = window.innerWidth; c.height = window.innerHeight;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(c.width, c.height);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = Math.random() * 255;
      d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  render();
  window.addEventListener('resize', render);
})();

// Snow
(function() {
  var c = document.getElementById('snow');
  c.width = window.innerWidth; c.height = window.innerHeight;
  var ctx = c.getContext('2d');
  var flakes = [];
  for (var i = 0; i < 120; i++) {
    flakes.push({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 2.5 + 0.8,
      speed: Math.random() * 0.6 + 0.15,
      drift: Math.random() * 0.3 - 0.15,
      opacity: Math.random() * 0.5 + 0.3
    });
  }
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + f.opacity + ')';
      ctx.fill();
      f.y += f.speed; f.x += f.drift;
      if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
      if (f.x > c.width) f.x = 0;
      if (f.x < 0) f.x = c.width;
    }
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', function() { c.width = window.innerWidth; c.height = window.innerHeight; });
})();
</script>
</body>
</html>
